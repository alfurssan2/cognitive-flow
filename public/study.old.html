<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Cognitive Flow - Study Mode</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b1326; color: #dae2fd; overflow-x: hidden; min-height: max(884px, 100dvh); }
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .flipped .flip-card-inner { transform: rotateY(180deg); }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(30, 41, 58, 0.5); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(192, 193, 255, 0.1); } 50% { box-shadow: 0 0 40px rgba(192, 193, 255, 0.2); } }
        .active-glow { animation: pulse-glow 3s infinite ease-in-out; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
    <!-- Header -->
    <header class="fixed top-0 w-full z-50 bg-surface/70 dark:bg-surface/70 backdrop-blur-xl shadow-sm border-b border-gray-800 flex items-center justify-between px-4 md:px-8 h-16">
        <a href="index.html" class="flex items-center gap-2 text-blue-400 hover:text-white transition-colors">
            <span class="material-symbols-outlined text-sm">arrow_back</span>
            <span class="text-sm font-bold uppercase tracking-wider">Dashboard</span>
        </a>
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-blue-400 font-headline-lg text-headline-lg" data-icon="brain">neurology</span>
            <h1 class="font-headline-lg text-headline-lg font-bold text-blue-400">Cognitive Flow</h1>
        </div>
        <div class="w-24"></div> <!-- spacer -->
    </header>

    <main class="flex-1 pt-24 pb-32 px-4 md:px-8 max-w-4xl mx-auto w-full flex flex-col gap-12">
        <!-- Progress Info -->
        <div class="flex justify-between items-center w-full">
            <div class="flex flex-col">
                <span class="text-sm text-gray-400 uppercase tracking-widest">Current Session</span>
                <span id="current-pillar-title" class="text-xl font-bold text-blue-400">Loading Session...</span>
            </div>
            <div class="text-right">
                <span id="card-counter" class="text-sm text-gray-400">Card 0 / 0</span>
                <div class="w-32 h-1 bg-gray-700 rounded-full mt-2 overflow-hidden">
                    <div id="progress-bar-fill" class="h-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.5)]" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Central Flashcard Area -->
        <div class="perspective-1000 w-full max-w-2xl mx-auto group" id="flashcard-container">
            <div class="flip-card-inner relative w-full h-full preserve-3d grid" id="flashcard-inner">
                <!-- Front Side -->
                <div id="card-front" class="col-start-1 row-start-1 backface-hidden glass-panel rounded-[24px] p-8 flex flex-col shadow-2xl active-glow transition-colors">
                    <div class="flex items-start justify-between mb-8">
                        <span class="bg-blue-900 text-blue-200 text-xs px-3 py-1 rounded-full font-bold">MULTIPLE CHOICE</span>
                    </div>
                    <h2 id="question-text" class="text-xl md:text-2xl text-white leading-snug mb-8">Generating exam environment...</h2>
                    <div id="options-container" class="grid grid-cols-1 gap-3">
                        <!-- Options injected via JS -->
                    </div>
                </div>

                <!-- Back Side -->
                <div id="card-back" class="col-start-1 row-start-1 backface-hidden rounded-[24px] p-8 flex flex-col shadow-2xl rotate-y-180" style="background-color: #1e293b;">
                    <div class="flex items-center gap-2 mb-6" id="back-header">
                        <span id="back-icon" class="material-symbols-outlined text-green-400">check_circle</span>
                        <span id="back-status-text" class="text-sm uppercase font-bold text-green-400">Correct Answer</span>
                    </div>
                    
                    <h2 id="correct-answer-display" class="text-xl font-bold mb-4 text-white overflow-y-auto max-h-32"></h2>
                    
                    <div class="flex-1 flex flex-col overflow-hidden my-4 relative bg-black/20 rounded-2xl border border-white/5">
                        <div id="chat-history" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
                            <!-- Messages -->
                        </div>
                        <div class="p-2 bg-black/40 border-t border-white/5 flex gap-2 items-center" onclick="event.stopPropagation()">
                            <input type="text" id="chat-input" class="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="Ask follow-up question..." autocomplete="off">
                            <button id="chat-send-btn" class="bg-blue-600 p-2 rounded-lg hover:bg-blue-500 flex items-center justify-center transition-colors">
                                <span class="material-symbols-outlined text-sm">send</span>
                            </button>
                        </div>
                    </div>
                    
                    <div class="mt-auto pt-6 border-t border-gray-600 flex justify-between items-center">
                        <span id="reference-text" class="text-sm opacity-70 text-gray-300">Ref: </span>
                        <button id="next-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-full font-bold active:scale-90 transition-all">
                            Next Card
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Integrated Performance Dashboard -->
        <section class="glass-panel rounded-[24px] p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="dashboard-container">
            <!-- Dashboard dynamically rendered via JS -->
        </section>
    </main>

    <!-- BottomNavBar -->
    <nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface/80 dark:bg-surface/80 backdrop-blur-2xl border-t border-gray-800 flex justify-around items-center h-20 pb-safe w-full px-4">
        <a class="flex flex-col items-center justify-center text-blue-400 rounded-full px-5 py-1" href="#">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">school</span>
            <span class="text-xs mt-1">Study Mode</span>
        </a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
    <script src="./firebase-config.js"></script>
    <script>
        let sessionQueue = [];
        let totalCardsInSession = 0;
        let cardsCompleted = 0;
        let currentQuestion = null;
        let stats = JSON.parse(localStorage.getItem('exam_stats')) || {};
        let currentUser = null;

        auth.onAuthStateChanged((user) => {
            currentUser = user;
        });

        const container = document.getElementById('flashcard-container');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const cardBack = document.getElementById('card-back');
        const backIcon = document.getElementById('back-icon');
        const backStatusText = document.getElementById('back-status-text');
        const correctAnswerDisplay = document.getElementById('correct-answer-display');
        const hintText = document.getElementById('hint-text');
        const hintIcon = document.getElementById('hint-icon');
        const referenceText = document.getElementById('reference-text');
        const currentPillarTitle = document.getElementById('current-pillar-title');
        const cardCounter = document.getElementById('card-counter');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const dashboardContainer = document.getElementById('dashboard-container');

        let chatHistoryArray = [];

        async function init() {
            try {
                const params = new URLSearchParams(window.location.search);
                const pillar = params.get('pillar');
                const url = pillar ? `/api/session?pillar=${encodeURIComponent(pillar)}` : '/api/session';
                
                const res = await fetch(url);
                const data = await res.json();
                if (data.session && data.session.length > 0) {
                    sessionQueue = data.session;
                    totalCardsInSession = sessionQueue.length;
                    renderDashboard();
                    loadNextQuestion();
                } else {
                    questionText.innerText = "No questions found. Check your Settings tab in Google Sheets.";
                }
            } catch (err) {
                console.error(err);
                questionText.innerText = "Failed to connect to backend.";
            }
        }

        function loadNextQuestion() {
            if (sessionQueue.length === 0) {
                questionText.innerText = "Session Complete! Great job.";
                optionsContainer.innerHTML = "";
                return;
            }

            currentQuestion = sessionQueue.shift();
            
            currentPillarTitle.innerText = currentQuestion.pillar;
            cardCounter.innerText = `Card ${cardsCompleted + 1} / ${totalCardsInSession}`;
            progressBarFill.style.width = `${(cardsCompleted / totalCardsInSession) * 100}%`;

            questionText.innerText = currentQuestion.question;
            
            optionsContainer.innerHTML = "";
            const labels = ['A', 'B', 'C', 'D'];
            currentQuestion.options.forEach((optText, i) => {
                const btn = document.createElement('button');
                btn.className = "group/btn flex items-center p-4 rounded-xl border border-gray-700 bg-gray-800 hover:bg-blue-900/50 transition-all text-left w-full";
                btn.onclick = (e) => handleAnswer(e, labels[i], optText);
                
                btn.innerHTML = `
                    <span class="shrink-0 w-8 h-8 rounded-lg bg-gray-700 flex items-center justify-center font-bold text-blue-400 mr-4 group-hover/btn:bg-blue-500 group-hover/btn:text-white">${labels[i]}</span>
                    <span class="text-gray-200 text-sm md:text-base">${optText}</span>
                `;
                optionsContainer.appendChild(btn);
            });
        }

        async function handleAnswer(event, selectedLabel, selectedText) {
            if (event) event.stopPropagation();
            
            const isCorrect = selectedLabel === currentQuestion.correctAnswerLabel;
            
            if (!stats[currentQuestion.pillar]) {
                stats[currentQuestion.pillar] = { correct: 0, total: 0 };
            }
            stats[currentQuestion.pillar].total += 1;
            
            if (isCorrect) {
                stats[currentQuestion.pillar].correct += 1;
                cardsCompleted += 1;
            } else {
                // Backwards Regression Logic
                const insertIndex = Math.min(Math.floor(Math.random() * 3) + 3, sessionQueue.length);
                sessionQueue.splice(insertIndex, 0, currentQuestion);
                totalCardsInSession += 1;
            }

            localStorage.setItem('exam_stats', JSON.stringify(stats));
            renderDashboard();
            if (currentUser) {
                db.collection("users").doc(currentUser.uid).set({ exam_stats: stats }, { merge: true }).catch(e => console.error("Firebase sync error", e));
            }

            correctAnswerDisplay.innerText = `${currentQuestion.correctAnswerLabel}: ${currentQuestion.correctAnswerText}`;
            referenceText.innerText = `Ref: ${currentQuestion.reference || 'N/A'}`;

            if (isCorrect) {
                cardBack.style.backgroundColor = '#064e3b';
                backIcon.innerText = 'check_circle';
                backIcon.className = 'material-symbols-outlined text-green-400';
                backStatusText.innerText = 'Correct Answer';
                backStatusText.className = 'text-sm uppercase font-bold text-green-400';
                
                document.getElementById('chat-history').innerHTML = `
                    <div class="flex gap-3">
                        <span class="material-symbols-outlined text-green-400">emoji_events</span>
                        <p class="text-sm text-green-100">Great job! You successfully recalled this concept.</p>
                    </div>`;
                
                // Allow them to chat even if they got it right (e.g. if they guessed)
                document.getElementById('chat-input').disabled = false;
                document.getElementById('chat-send-btn').disabled = false;
                
                chatHistoryArray = [];
                chatHistoryArray.push({ 
                    role: 'user', 
                    parts: [{ text: `I correctly answered "${selectedText}" to the question "${currentQuestion.question}". I might have a follow up question.` }] 
                });
                chatHistoryArray.push({ 
                    role: 'model', 
                    parts: [{ text: "Great job on getting that correct! Do you have any questions about this concept before we move on?" }] 
                });
                
                container.classList.add('flipped');
            } else {
                cardBack.style.backgroundColor = '#4c0519';
                backIcon.innerText = 'cancel';
                backIcon.className = 'material-symbols-outlined text-red-400';
                backStatusText.innerText = 'Incorrect Answer';
                backStatusText.className = 'text-sm uppercase font-bold text-red-400';
                
                document.getElementById('chat-input').disabled = false;
                document.getElementById('chat-send-btn').disabled = false;
                chatHistoryArray = []; // Reset history for new question
                document.getElementById('chat-history').innerHTML = `
                    <div class="flex gap-3">
                        <span class="material-symbols-outlined text-blue-300 animate-spin">sync</span>
                        <p class="text-sm text-blue-100 italic">Analyzing conceptual gap with AI...</p>
                    </div>`;

                container.classList.add('flipped');

                try {
                    const res = await fetch('/api/hint', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            question: currentQuestion.question,
                            incorrectAnswer: selectedText,
                            correctAnswer: currentQuestion.correctAnswerText
                        })
                    });
                    const hintData = await res.json();
                    
                    // Seed chat history for follow-ups
                    chatHistoryArray.push({ 
                        role: 'user', 
                        parts: [{ text: `I answered "${selectedText}" to the question "${currentQuestion.question}". The correct answer is "${currentQuestion.correctAnswerText}". Explain why.` }] 
                    });
                    chatHistoryArray.push({ 
                        role: 'model', 
                        parts: [{ text: hintData.conceptual_hint }] 
                    });
                    
                    document.getElementById('chat-history').innerHTML = `
                        <div class="flex gap-3">
                            <span class="material-symbols-outlined text-blue-300">${hintData.snapshot_icon || 'psychology'}</span>
                            <p class="text-sm text-blue-100 leading-relaxed">${hintData.conceptual_hint}</p>
                        </div>`;
                } catch (e) {
                    document.getElementById('chat-history').innerHTML = `<p class="text-sm text-red-400">Failed to load conceptual hint.</p>`;
                }
            }
        }

        document.getElementById('chat-send-btn').onclick = async (e) => {
            if (e) e.stopPropagation();
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;
            
            input.value = '';
            const historyDiv = document.getElementById('chat-history');
            
            historyDiv.innerHTML += `
                <div class="flex gap-3 justify-end mt-2">
                    <p class="text-sm bg-blue-900/50 text-blue-100 px-3 py-2 rounded-xl rounded-tr-sm">${message}</p>
                </div>`;
            historyDiv.scrollTop = historyDiv.scrollHeight;
            
            const loadingId = 'loading-' + Date.now();
            historyDiv.innerHTML += `
                <div id="${loadingId}" class="flex gap-3 mt-2">
                    <span class="material-symbols-outlined text-purple-300 animate-spin">sync</span>
                </div>`;
            historyDiv.scrollTop = historyDiv.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history: chatHistoryArray, message })
                });
                const data = await res.json();
                
                document.getElementById(loadingId).remove();
                
                historyDiv.innerHTML += `
                    <div class="flex gap-3 mt-2">
                        <span class="material-symbols-outlined text-purple-300">smart_toy</span>
                        <p class="text-sm text-purple-100 leading-relaxed">${data.reply}</p>
                    </div>`;
                
                chatHistoryArray.push({ role: 'user', parts: [{ text: message }] });
                chatHistoryArray.push({ role: 'model', parts: [{ text: data.reply }] });
                historyDiv.scrollTop = historyDiv.scrollHeight;
            } catch (err) {
                 document.getElementById(loadingId).remove();
                 historyDiv.innerHTML += `<p class="text-red-400 text-xs">Failed to connect to AI.</p>`;
            }
        };

        document.getElementById('chat-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('chat-send-btn').click();
        });

        // Prevent flip when clicking chat
        document.getElementById('chat-history').onclick = (e) => e.stopPropagation();

        document.getElementById('next-btn').onclick = (e) => {
            if (e) e.stopPropagation();
            container.classList.remove('flipped');
            setTimeout(() => {
                loadNextQuestion();
            }, 300);
        };

        function renderDashboard() {
            dashboardContainer.innerHTML = "";
            const colors = [
                { bg: 'bg-blue-500', text: 'text-blue-400', shadow: 'shadow-[0_0_12px_rgba(59,130,246,0.4)]' },
                { bg: 'bg-purple-500', text: 'text-purple-400', shadow: 'shadow-[0_0_12px_rgba(168,85,247,0.4)]' },
                { bg: 'bg-green-500', text: 'text-green-400', shadow: 'shadow-[0_0_12px_rgba(34,197,94,0.4)]' },
                { bg: 'bg-yellow-500', text: 'text-yellow-400', shadow: 'shadow-[0_0_12px_rgba(234,179,8,0.4)]' }
            ];
            
            let colorIndex = 0;
            for (const [pillar, data] of Object.entries(stats)) {
                if (data.total === 0) continue;
                const percentage = Math.round((data.correct / data.total) * 100);
                const theme = colors[colorIndex % colors.length];
                
                const col = document.createElement('div');
                col.className = "flex flex-col gap-3";
                col.innerHTML = `

                    <div class="flex justify-between items-start gap-4">
                        <span class="text-md md:text-lg flex gap-2 text-gray-200 overflow-hidden">
                            <span class="material-symbols-outlined ${theme.text} shrink-0">analytics</span>
                            <span class="line-clamp-2" title="${pillar}">${pillar}</span>
                        </span>
                        <div class="text-right shrink-0">
                            <span class="${theme.text} font-bold text-xl block">${percentage}%</span>
                            <span class="text-xs text-gray-400">${data.correct}/${data.total} correct</span>
                        </div>
                    </div>
                    <div class="h-2 bg-gray-700 rounded-full overflow-hidden mt-1">
                        <div class="h-full ${theme.bg} ${theme.shadow} transition-all duration-500" style="width: ${percentage}%"></div>
                    </div>
                `;
                dashboardContainer.appendChild(col);
                colorIndex++;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && container.classList.contains('flipped')) {
                e.preventDefault();
                document.getElementById('next-btn').click();
            }
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
